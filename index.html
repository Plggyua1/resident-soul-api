<!DOCTYPE html>
<html>
<head>
    <title>Resident Vision</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; text-align: center; }
        img { width: 80%; border: 2px solid #0f0; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>LIVE: RESIDENT_PLAYER POV</h1>
    <img id="view" src="" onerror="this.style.display='none'">
    <script>
        setInterval(async () => {
            const res = await fetch('/api/upload');
            const data = await res.json();
            if (data.image) {
                document.getElementById('view').src = data.image;
                document.getElementById('view').style.display = 'inline';
            }
        }, 1000); // Refresh every second
    </script>
</body>
</html>
